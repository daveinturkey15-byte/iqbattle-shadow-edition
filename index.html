/* Torment selector is gone: difficulty is a fixed baseline curve driven by

/* Fan an engine event out to window.IQ.Hooks (defensive — activates the

function dispatchHook(evt,extra){
 try{
  const H=window.IQ&&window.IQ.Hooks;if(!H||typeof H.dispatch!=='function')return[];

  return H.dispatch(evt,Object.assign({round:G.round,depth:G.round,stage:G.stage,hp:G.hp,score:G.score,streak:G.streak,lms:!!G.lms,mp:!!G.mp.on,world:(G.w1&&G.w1.theme)||null,align:(G.w1&&G.w1.align)||null,rng:rng},extra||{}))||[];
 }catch(e){return[]}
}
/* Apply one batch of hook modifier flags onto live game state. */

   if(typeof f.hpDelta==='number'){if(f.hpDelta>0)healHp(f.hpDelta);else if(f.hpDelta<0)hurtHp(-f.hpDelta)}

   if(Array.isArray(f.disableOptionIdx)&&f.disableOptionIdx.length){

    dis.forEach(i=>{if(i>=0&&i<8)G.disabledOpts.add(i)});
    $$('#opts-grid .opt-btn').forEach(b=>{if(dis.has(+b.dataset.i))b.classList.add('opt-disabled')});
   }
   if(typeof f.invertControlsMs==='number'&&f.invertControlsMs>0)G.invertUntil=performance.now()+f.invertControlsMs;
   if(f.overlayHTML){const d=document.createElement('div');d.className='hook-overlay';d.innerHTML=String(f.overlayHTML).slice(0,2000);document.body.appendChild(d);const ms=typeof f.overlayMs==='number'?f.overlayMs:3200;setTimeout(()=>d.remove(),Math.max(400,ms))}

   }
  }catch(e){}
 }
}

function tileSVG(tile,size,palIdx,showQ){

 for(let i=0;i<cols*rows;i++){const c=cells[i],x=(i%cols)*cs,y=Math.floor(i/cols)*cs;

    if(G.screen==='play'&&to!=='play'){cancelAnimationFrame(G.raf);clearInterval(G.shuffleIv);G.answered=true}
    $$('#app > section').forEach(x=>x.classList.add('hidden'));
    $('#topbar').classList.toggle('hidden',to!=='play');
    G.screen=to;
    $({'landing':'#scr-boot','lobby':'#scr-lobby','play':'#scr-play','center':'#scr-center'}[to]).classList.remove('hidden');
  };
  AU.p('click');
  try{window.IQ&&IQ.Transitions?IQ.Transitions.to(apply):apply()}catch(e){apply()}
}
function banner(txt){const b=document.createElement('div');b.className='event-banner';b.textContent=txt;document.body.appendChild(b);CX.shake(6,180);setTimeout(()=>b.remove(),1700)}

/* ---------- scoreboard ---------- */
function renderScores(){
 const sp=$('#side-panel');if(!sp)return;
 const rows=[{me:1,name:P.name||'YOU',ava:'🜃',pts:G.score},...(G.opps||[]).map(o=>({name:o.n,ava:o.ava,pts:o.pts})),...(G.humans||[]).map(h=>({name:h.n,ava:'🜂',pts:h.pts,uid:h.uid,elim:h.elim}))];
 rows.sort((a,b)=>b.pts-a.pts);
 sp.innerHTML=rows.map((o,i)=>`<div class="score-card ${o.me?'me':''} ${i===0?'leader':''}">
  <div class="sc-ava">${o.ava}</div><div style="flex:1;min-width:0"><div class="sc-name">${esc(o.name)}</div>
  <div class="sc-sub">${o.me?(G.streak>1?'streak ×'+G.streak:(o.elim?'ELIMINATED':'you')):(o.elim?'ELIMINATED':'rival')}</div></div>
  <div class="sc-pts">${o.pts}</div></div>`).join('');
 if(G.lms&&G.mp.on){const cards=sp.querySelectorAll('.score-card:not(.me)');const targets=rows.filter(r=>!r.me&&r.uid);cards.forEach((c,i)=>{const row=targets[i];if(row)c.onclick=()=>tryAttack(row.uid)})}
}

function tryAttack(uid){
 if(!(G.lms&&G.mp.on&&window.IQ))return;
 const weapons={rotten:{cost:80,dmg:120},curse:{cost:150,dmg:200}};
 const w=(prompt('ATTACK '+uid+' — type rotten or curse')||'').trim().toLowerCase();
 if(!weapons[w])return void banner('UNKNOWN WEAPON');
 if(G.score<weapons[w].cost)return void banner('NOT ENOUGH POINTS — COSTS '+weapons[w].cost);
 const myUid=(window.IQ&&IQ.Net&&IQ.Net.myUid)?IQ.Net.myUid():'host';
 IQ.Net.send({t:'attack',from:myUid,targetUid:uid,weapon:w,n:P.name});
 banner('ATTACK SENT — '+w.toUpperCase());
}
/* ---------- run flow ---------- */
function startRun(){
 $('#center-content').innerHTML='';
 G.round=0;G.score=0;G.streak=0;G.stage=-1;setStage(0);
 try{window.IQ&&IQ.Fun&&IQ.Fun.reset()}catch(e){}
 /* ENDLESS: no round limit — runs end only at hp<=0 (solo) or last-man-standing (MP) */
 G.timerLen=clamp(G.mpCfg&&G.mpCfg.timer!=null?G.mpCfg.timer:(+$('#cfg-timer').value||60),1,120);
 G.hookScoreMul=1;G.invertUntil=0;G.disabledOpts=null;G.spectating=false;G.hookSeq=0;
 try{G.hookSeed=(Math.random()*0xFFFFFFFF)>>>0;window.IQ&&IQ.Hooks&&IQ.Hooks.beginRun&&IQ.Hooks.beginRun(G.mp.code||('solo-'+Date.now()),G.hookSeed)}catch(e){}
 G.lms=(function(){ if(!G.mp.on)return false; if(G.mpCfg&&G.mpCfg.lms!=null)return !!G.mpCfg.lms; var e=document.getElementById('cfg-lms'); return !!(e&&e.classList.contains('on')); })();
 G.remotePicks={};G.remoteAttacks={};G.humans=[];G.lastAppliedRevealRound=null;
 G.hp=100;G.w1=null;G.prevAlign=null;renderHp();
 try{window.IQ&&IQ.Worlds&&IQ.Worlds.clear()}catch(e){}
 try{window.IQ&&IQ.Align&&IQ.Align.begin(G.mp.code||('solo-'+Date.now()),4096)}catch(e){} /* endless: plan far ahead */
 try{window.IQ&&IQ.Review&&IQ.Review.beginMatch()}catch(e){}
 G.emeralds=[];G.usedEmeralds=new Set();G.chaosControlLeft=0;G.blackArrowLeft=0;G.zapFired=false;
 G.forgery=$('#cfg-forged').classList.contains('on');
 S.shadowOn=$('#cfg-shadow').classList.contains('on');
 if(G.mp.on&&(G.players||[]).length<=1){G.mp={on:false,host:false,code:''}}
 G.opps=G.mp.on?[]:ROSTER.slice(0,2).map(o=>({...o,pts:0}));
 nav('play');updateTitle();renderScores();
 setTimeout(()=>nextRound(),800);
}

function nextRound(){
 if(G.mp.on&&!G.mp.host){G.awaitingRound=true;return} // clients only receive host deals
 clearInterval(G.shuffleIv);
 G.round++;
 G.answered=false;G.zapFired=false;G.impossibleNow=false;
 G.hookScoreMul=1;G.invertUntil=0;G.disabledOpts=null;
 // slow-burn stage gates
 if(G.round===3)setStage(1);else if(G.round===5)setStage(2);else if(G.round===7)setStage(3);
/* W1: host computes the plan slice here; MP clients receive it via the frame */
if(!G.mp.on||G.mp.host){try{G.w1=(window.IQ&&IQ.Align)?IQ.Align.at(G.round):null}catch(e){G.w1=null}}
applyW1Effects();
/* W1: curse/blessing roll (host+solo only; presentation + flag consumption) */
try{
 if(window.IQ&&IQ.Curses&&G.w1){
  const ev=IQ.Curses.roll({align:G.w1.align,round:G.round});
  G.curseMul=null;
  if(ev){
   IQ.Curses.apply(ev);
   const f=ev.flags||{};
   if(f.hpDelta<0)hurtHp(-f.hpDelta); else if(f.hpDelta>0)healHp(f.hpDelta);
   if(f.scoreMul)G.curseMul=f.scoreMul;
   if(f.forgiveNext)G.forgiveNext=true;
  }
 }
}catch(e){}

 let pz=null;
 if(!G.mp.on||G.mp.host){
  const useForged=G.forgery&&store.get('IQB_PUZZLES_V1',[]).length&&(G.round<=2||Math.random()<.5);
  if(useForged){pz={...store.get('IQB_PUZZLES_V1',[])[ri(0,store.get('IQB_PUZZLES_V1',[]).length-1)]}}
  else pz=makePuzzle(clamp(depthDiff()+(G.w1&&G.w1.amp?1:0),1,5));
function makePuzzle(diff){
 const G_=(window.IQ&&IQ.Gens)||{};const S=G.stage;
 const table=S<=0?['iqvs','iqvs','latin','cycle']:S===1?['iqvs','iqvs','latin','cycle','rotate','count','logicA','missingSec']:S===2?['iqvs','latin','cycle','rotate','count','dual','dual','logicA','logicB','seqPack','missingSec']:['wild','wild','dual','iqvs','latin','rotate','logicA','logicB','seqPack','missingSec'];
  let gname=table[ri(0,table.length-1)];
  if(S>=2&&(G_.retroA||G_.retroB)&&Math.random()<.12)gname=(G_.retroA&&(!G_.retroB||Math.random()<.5))?'retroA':'retroB';
  const gen=G_[gname];
 const kinds=S>=2?['matrix','sequence','oddone']:['matrix','matrix','sequence'];
 if(gen&&gen.generate){try{
   const p=gen.generate({difficulty:diff,kinds});
   const okShape=p&&p.options&&p.options.length===8&&Number.isFinite(p.difficulty)&&(p.board||p.seq||p.oddBoard||(p.kind==='retro'&&p.retro));
   if(okShape&&(!gen.validate||gen.validate(p).ok!==false))return p;
 }catch(e){}}
 try{return IQ.Puzzles.generate({difficulty:diff})}catch(e){return fallbackPuzzle()}
}
  const tl=timeline();
  if(pz.board&&tl.corruptChance&&Math.random()<tl.corruptChance){
   const idx=pz.board.cells.findIndex((c,i)=>i!==pz.board.holeIndex&&c);
   if(idx>=0)pz.board.cells[idx]={...pz.board.cells[idx],color:(pz.board.cells[idx].color+ri(1,7))%8};
   pz.corrupted=true;}
  if(pz.options&&tl.impossibleChance&&Math.random()<tl.impossibleChance){
   const a=pz.answer;pz.options[a]=JSON.parse(JSON.stringify(pz.options[(a+3)%8]));pz.impossible=true;}
  G.puzzle=pz;
  pz.w1=G.w1||undefined;
  // ONE shuffled option order per round, fixed by the host and shipped in the
  // round frame — otherwise each tab shuffles locally and a client's `pos`
  // maps to a DIFFERENT tile on the host (picks scored against wrong option).
  pz.ord=shuffledOrder(pz.options.length);
 }
 broadcastRound();
 renderBoard();
 try{window.IQ&&IQ.Fun&&IQ.Fun.onRoundStart(G.round)}catch(e){}
 fireHooks('onRoundStart',{world:(G.w1&&G.w1.theme)||null,align:(G.w1&&G.w1.align)||null});
 startTimer();
 if(!G.mp.on)G.opps.forEach(o=>simOpponent(o));
}
function fallbackPuzzle(){
 const cells=[];for(let i=0;i<9;i++)cells.push(i===4?null:{shape:'plus',color:(i%2===0?i:i+2)%8,rot:i%4});
 const correct={shape:'plus',color:2,rot:0};
 return{id:'fb'+Date.now(),kind:'matrix',difficulty:1,rule:'colors advance along rows',
  board:{cols:3,rows:3,cells,holeIndex:4},
  options:Array.from({length:8},(_,i)=>({cols:1,rows:1,cells:[i?{...correct,color:(correct.color+i)%8}:correct]})),answer:0};
}
function shuffledOrder(n){const o=Array.from({length:n},(_,i)=>i);for(let i=o.length-1;i>0;i--){const j=ri(0,i);[o[i],o[j]]=[o[j],o[i]]}return o}
function broadcastRound(){
 if(!(G.mp.on&&G.mp.host)||!G.puzzle)return;
 try{
  const pz=G.puzzle;
  const ob=pz.oddBoard?{cols:pz.oddBoard.cols,rows:pz.oddBoard.rows,cells:pz.oddBoard.cells}:undefined;
  IQ.Net.broadcast({t:'round',n:G.round,timerLen:G.timerLen,kind:pz.kind,board:pz.board,oddBoard:ob,seq:pz.seq,options:pz.options,ord:pz.ord,imp:pz.impossible?1:0,w1:(pz.w1||undefined)});
 }catch(e){ try{localStorage.setItem('iqvs-neterr',String(e&&e.message||e))}catch(_e){} }
}
function renderBoard(){
 const pz=G.puzzle;if(!pz)return;
 $('#round-label').textContent=`DEPTH ${G.round}`;
 let html='';const SZ=Math.max(180,Math.min(330,innerWidth-110,innerHeight-300));
 if(pz.kind==='matrix')html=tileSVG(pz.board,SZ,pal(),true);
 else if(pz.kind==='sequence'){const cs=SZ/(pz.seq.length+1);
  html=`<div style="display:flex;gap:10px;align-items:center">${pz.seq.map(c=>tileSVG({cols:1,rows:1,cells:[c]},cs*.8,pal(),false)).join('')}${tileSVG({cols:1,rows:1,cells:[null]},cs*.8,pal(),true)}</div>`;}
 else html=tileSVG(pz.oddBoard,SZ,pal(),false)+'<div style="text-align:center;margin-top:8px;font-size:11px;letter-spacing:.2em;opacity:.6">ONE FRAGMENT IS AN IMPOSTOR</div>';
 $('#board-frame').innerHTML=html;G.boardSVGLast=html;
 drawOptions();
 maybeZap();
}
function drawOptions(){
 const og=$('#opts-grid'),pz=G.puzzle;if(!pz||!pz.options)return;og.innerHTML='';
 let order=pz.ord;
 if(!order||order.length!==pz.options.length){ // solo mode: shuffle locally
  order=pz.options.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=ri(0,i);[order[i],order[j]]=[order[j],order[i]]}
 }
 G.optOrder=order;
 order.forEach((oi,pos)=>{
  const b=document.createElement('div');b.className='opt-btn';b.dataset.i=oi;
  b.innerHTML=tileSVG(optTile(pz.options[oi]),104,pal(),false)+`<span class="opt-key">${pos+1}</span>`;
  b.onclick=()=>answer(pos);og.appendChild(b);});
}
function applyIncomingRound(pl){
 G.awaitingRound=false;G.round=pl.n;G.timerLen=pl.timerLen;G.answered=false;G.impossibleNow=!!pl.imp;
 G.hookScoreMul=1;G.invertUntil=0;G.disabledOpts=null;
 G.puzzle={kind:pl.kind,board:pl.board,oddBoard:pl.oddBoard,seq:pl.seq,options:pl.options,ord:pl.ord,answer:-99};
 G.w1=pl.w1||null;applyW1Effects();
 renderBoard();startTimer();
}

/* ---------- mid-round zap (round 1 signature) ---------- */
function maybeZap(){
 const tl=timeline();
 if(G.round!==1||!tl.zapAtFraction||G.zapFired)return;G.zapFired=true;
 setTimeout(()=>{
  const z=document.createElement('div');z.style.cssText='position:fixed;inset:0;z-index:120;background:#dff3ff';document.body.appendChild(z);
  AU.p('glitch');CX.invert(220);CX.flash('rgba(223,243,255,.85)',140);CX.shake(18,420);
  const bf=$('#board-frame');bf.style.filter='brightness(0)';
  banner('POWER CUT?');
  setTimeout(()=>{bf.style.filter='';z.remove();if(S.shadowOn)SH.say(SH.q('zap'),true)},420);
 },G.timerLen*tl.zapAtFraction*1000);
}

/* ---------- timer ---------- */
function startTimer(){
 const dur=G.timerLen;
 cancelAnimationFrame(G.raf);
 G.timeLeft=G.timerLen;G.lastTick=99;G.t0=performance.now();
 const step=t=>{
  const dt=Math.max(0,(t-(G._lastFrameT||t))/1000);G._lastFrameT=t;
  const left=Math.max(0,dur-(t-G.t0)/1000);G.timeLeft=left;
  $('#timer-fill').style.transform=`scaleX(${dur?left/dur:0})`;
  $('#timer-num').textContent=Math.ceil(left);
  $('#round-strip').classList.toggle('timer-low',left<=10);
  if(left<=10&&Math.ceil(left)!==G.lastTick){G.lastTick=Math.ceil(left);AU.p(left<=5?'tick':'heart',{vol:.3});CX.pulse()}
  fireHooks('onTick',{dtSec:dt,world:(G.w1&&G.w1.theme)||null,align:(G.w1&&G.w1.align)||null});
  if(left<=0&&!G.answered)answer(-1);
  else if(!G.answered)G.raf=requestAnimationFrame(step);
 };
 G.raf=requestAnimationFrame(step);
}

/* ---------- solo opponents ---------- */
function simOpponent(o){
 setTimeout(()=>{
  o.pts+=Math.random()<clamp(o.acc-(depthDiff()-2)*.05,.3,.95)?ri(80,140):ri(-30,20);
  renderScores();
  if(Math.random()<.15){const b=document.createElement('div');b.className='taunt-bubble';
   b.innerHTML=`<b>${esc(o.n)}:</b> ${esc(TAUNTS[ri(0,TAUNTS.length-1)])}`;
   b.style.left=rnd(8,58)+'vw';b.style.top=rnd(14,46)+'vh';document.body.appendChild(b);
   setTimeout(()=>b.remove(),2400);}
 },rnd(5,o.spd*1.5)*1000);
}

/* ---------- answering ---------- */
function answer(pos){
 if(G.answered||!G.puzzle||!G.puzzle.options)return;
 if(G.spectating)return;
 if(pos>=0&&G.disabledOpts&&G.disabledOpts.has(G.optOrder[pos]))return;
 G.answered=true;
 fireHooks('onPreAnswer',{pos});
 if(pos>=0&&G.disabledOpts&&G.disabledOpts.has(G.optOrder[pos])){G.answered=false;return} // a pack vetoed this option
 if(pos>=0)G.myPickIdx=G.optOrder[pos];else G.myPickIdx=-1;
 const pz=G.puzzle;
 const clientPick=G.mp.on&&!G.mp.host;
 const impossible=clientPick?!!G.impossibleNow:(pz.answer===-99||pz.impossible);
 const correct=!impossible&&pos>=0&&G.optOrder[pos]===pz.answer;
 if(clientPick){try{IQ.Net.send({t:'pick',n:G.round,pos,name:P.name,uid:(window.IQ&&IQ.Net&&IQ.Net.myUid)?IQ.Net.myUid():null})}catch(e){}}
 const btns=$$('#opts-grid .opt-btn');
 btns.forEach(b=>b.classList.toggle('picked',pos>=0&&G.optOrder[pos]===+b.dataset.i));
 const cb=btns.find(b=>+b.dataset.i===pz.answer);
 if(!correct&&pos>=0)btns.find(b=>G.optOrder[pos]===+b.dataset.i)?.classList.add('wrongpick');
 if(cb&&!impossible)setTimeout(()=>cb.classList.add('correct'),250);
 if(clientPick){
  if(impossible)banner('THIS ROUND MADE NO SENSE. NOBODY WINS.');
  fireHooks('onAnswer',{correct,pos,res:{correct:!!(pos>=0&&correct),picked:(pos>=0?G.optOrder[pos]:-1),correctIdx:-99}}); // host is the scorer — reveal will tell the truth
  return;
 }
 if(impossible){
  if(G.emeralds.includes('chaos_control')&&G.chaosControlLeft>0){
   G.chaosControlLeft--;banner('CHAOS CONTROL — TIME FREEZES');SH.say('CHAOS CONTROL!',true);scoreMe(150,true);}
  else if(G.emeralds.includes('crimson_veil')){banner('THE CRIMSON VEIL DRINKS THE CURSE');scoreMe(40,true);}
  else{banner('THIS ROUND MADE NO SENSE. NOBODY WINS.');scoreMe(-25,false,true);SH.say(SH.q('impossible'),true);}
 }else if(pos>=0&&correct){
  G.streak++;
  const speed=clamp(G.timeLeft/G.timerLen,0,1);
  let pts=Math.round(100*pz.difficulty+speed*80+(G.streak>1?(G.streak-1)*20:0));
  if(G.emeralds.includes('doom_bloom'))pts=Math.round(pts*1.3);
  if(G.emeralds.includes('gravity_greed')){const lead=[...G.opps].sort((a,b)=>b.pts-a.pts)[0];if(lead){lead.pts=Math.max(0,lead.pts-60);pts+=60}}
  if(G.emeralds.includes('final_chaos')&&G.round%10===0)pts*=2;
  if(G.curseMul)pts=Math.round(pts*G.curseMul);
  if(G.hookScoreMul!==1)pts=Math.max(1,Math.round(pts*G.hookScoreMul));
  scoreMe(pts,true);AU.p('sting');CX.flash('rgba(34,211,165,.10)',130);
  if(G.streak>=4&&Math.random()<.5)SH.say(SH.q('right'),true);
 }else if(pos===-3&&G.blackArrowLeft>0){
  G.blackArrowLeft--;banner('BLACK ARROW SPENT — SIN FORGIVEN');scoreMe(10,true);
 }else{
  if(G.forgiveNext){
   G.forgiveNext=false;banner('GRACE — THIS SIN IS FORGIVEN');
   scoreMe(0,true);
  }else{
   G.streak=0;const pts=-40;
   if(G.emeralds.includes('final_chaos')&&G.round%10===0){G.score=Math.round(G.score*.5);banner('FINAL CHAOS PUNISHES')}
   if(G.emeralds.includes('doom_bloom'))G.opps.forEach(o=>o.pts-=20);
   scoreMe(pts,false);hurtHp(15);AU.p('buzz');CX.shake(12,280);AU.p('laugh',{vol:.3});
   if(Math.random()<.35&&G.stage>=2)SH.say(SH.q('wrong'),true);
  }
 }
 fireHooks('onAnswer',{correct,pos,res:{correct,picked:(pos>=0?G.optOrder[pos]:-1),correctIdx:impossible?-1:pz.answer}});

 setTimeout(()=>{
  fireHooks('onReveal',{correctIdx:impossible?-1:pz.answer});
  if(G.mp.host){
   const myUid=(window.IQ&&IQ.Net&&IQ.Net.myUid)?IQ.Net.myUid():null;
   try{
    // HOST-AUTHORITATIVE SCORING — every entry carries its stable uid so
    // clients match by uid, never by name (two tabs may share a profile name).
    // per-round delta -> ACCUMULATED total: frames always carry totals
    // (same semantics as the host's own entry) so clients can assign directly.
    const humans=Object.values(G.remotePicks||{}).map(pk=>{
     const okPick=pk.pos>=0&&G.optOrder[pk.pos]===pz.answer&&!pz.impossible;
     const delta=pz.impossible?-25:(okPick?Math.round(100*pz.difficulty+40):-40);
     const gh=(G.humans||[]).find(x=>x.uid===pk.uid);
     return {uid:pk.uid,name:pk.n||'PLAYER',pts:(gh?(gh.pts||0):0)+delta};
    });
   humans.forEach(h=>{const gh=(G.humans||[]).find(x=>x.uid===h.uid);if(gh){gh.pts=h.pts;gh.n=h.name||h.n}});
   try{window.IQ&&IQ.Review&&IQ.Review.snap({round:G.round,boardSVGString:G.boardSVGLast||'',options:[],ord:G.optOrder||[],correctIdx:pz.impossible?-1:pz.answer,pickedIdxByUid:(function(){const m={};m[myUid]=(typeof G.myPickIdx==='number')?G.myPickIdx:-1;(G.humans||[]).forEach(h=>{const pk=(G.remotePicks||{})[h.uid];m[h.uid]=pk?((typeof G.myPickIdx==='number'&&pk.pos>=0)?pk.pos:-1):-1});return m})(),timesMsByUid:{}})}catch(e){}
    renderScores(); // broadcast echoes locally but host reveal handler self-guards
    IQ.Net.broadcast({t:'reveal',answer:pz.impossible?-99:pz.answer,imp:pz.impossible?1:0,scores:[{uid:myUid,name:P.name,pts:G.score},...G.opps.map(o=>({name:o.n,pts:o.pts})),...humans]});
   }catch(e){}
   G.remotePicks={};
  }
 },1400);
 setTimeout(()=>{
  if(G.mp.on&&!G.mp.host)return; // clients idle — host deals the next round
  if(G.lms&&G.mp.host&&window.IQ&&IQ.LMS){
   /* W1 MP: resolve queued point-attacks before revealing standings */
   const myUid=(window.IQ&&IQ.Net&&IQ.Net.myUid)?IQ.Net.myUid():'host';
   const table=[{uid:myUid,pts:G.score},...(G.humans||[]).map(h=>({uid:h.uid,pts:h.pts}))];
   let attacked=false;
   for(const [att,w] of Object.entries(G.remoteAttacks||{})){
    const res=IQ.LMS.attackResult({scores:table.map(s=>({...s})),attackerUid:att,targetUid:w.targetUid,weapon:w.weapon});
    if(res){attacked=true;
     for(const row of res){const me2=row.uid===myUid;if(me2)G.score=row.pts;else{const h=(G.humans||[]).find(x=>x.uid===row.uid);if(h)h.pts=row.pts}}
     banner((w.targetUid===myUid?'YOU WERE HIT':'STRIKE LANDED')+' — '+w.weapon.toUpperCase());}
     delete G.remoteAttacks[att];
   }
   if(attacked)renderScores();
  }
  /* ENDLESS: no round-count gate. Solo loops forever; an LMS match ends ONLY
   * when IQ.LMS.remaining() reports one or zero players still standing. */
  if(G.lms&&G.mp.host){
   const alive=window.IQ&&IQ.LMS?IQ.LMS.remaining((G.humans||[]).filter(h=>!h.elim).map(h=>({uid:h.uid,pts:h.pts})).concat([{uid:'host',pts:G.score}])):null;
   if(alive&&alive.length<=1){endMatchBroadcast();endRun();return}
  }
  if(G.opps.length>0&&G.round%4===0&&G.usedEmeralds.size<EMERALDS.length)emeraldPick();
  else if(window.IQ&&IQ.Cleanse&&IQ.Cleanse.maybeTrigger(G.stage,G.round)){IQ.Cleanse.trigger&&IQ.Cleanse.trigger();try{window.IQ&&IQ.BoardMove&&IQ.BoardMove.pause(1800)}catch(e){};nextRound();return}
  else nextRound();
},1700);
}
function scoreMe(pts,good,silent){
 G.score+=pts;renderScores();
 P.totalCorrect+=good?1:0;P.totalWrong+=good?0:1;saveP();
 if(!silent&&good&&pts>50&&G.puzzle.rule)flashRule();

function onRemotePick(pk){if(!(G.mp.host&&pk))return;
 // key by stable uid — NEVER by display name (same-profile tabs collide)
 const uid=pk.uid||pk.from||('anon-'+pk.n);
 G.remotePicks[uid]={uid,n:pk.name||pk.n||'PLAYER',pos:pk.pos};
 G.humans=G.humans||[];
 if(!G.humans.find(h=>h.uid===uid))G.humans.push({uid,n:pk.name||pk.n||'PLAYER',pts:0});
}
function hostMp(code){ /* host path: after Create Room with code */ }
/* Apply a host-authored scores array ({uid,name,pts}[...]) onto local state.
 * SELF is matched by stable uid first (name only as legacy fallback); every
 * other entry lands in G.humans keyed by uid so same-name tabs stay distinct. */
function applyScoresFrame(scores){
 if(!Array.isArray(scores))return;
 const myUid=(window.IQ&&IQ.Net&&IQ.Net.myUid)?IQ.Net.myUid():null;
 const isMe=s=>(myUid&&s.uid===myUid)||(!s.uid&&s.name===P.name);
 const me=scores.find(isMe);
 if(me)G.score=me.pts;
 G.humans=G.humans||[];
 scores.filter(s=>!isMe(s)).forEach(s=>{
  let h=G.humans.find(x=>x.uid&&s.uid&&x.uid===s.uid)||(!s.uid&&G.humans.find(x=>!x.uid&&x.n===s.name));
  if(!h){h={uid:s.uid||null,n:s.name||'PLAYER',pts:0};G.humans.push(h)}
  h.n=s.name||h.n;h.pts=s.pts;
 });
 renderScores();
}

function listenNet(){
 try{
  IQ.Net.on('lobby',pl=>{G.players=(pl.players||[]);$('#lobby-count').textContent=G.players.length;});
  IQ.Net.on('pick',pk=>onRemotePick(pk));
   IQ.Net.on('begin',m=>{if(G.mp.on&&!G.mp.host){G.mpCfg={timer:m&&m.timer||60,lms:!!(m&&m.lms)};startRun()}});
  IQ.Net.on('round',pl=>{if(G.mp.host)return;applyIncomingRound(pl)});
  IQ.Net.on('attack',a=>{if(!(G.mp.host&&a))return;const uid=a.from||a.uid||('anon-'+(a.n||''));G.remoteAttacks[uid]={targetUid:a.targetUid,weapon:a.weapon,n:a.n}});
  IQ.Net.on('elim',m=>{if(!m||!m.uids)return;m.uids.forEach(u=>{const h=(G.humans||[]).find(x=>x.uid===u);if(h)h.elim=true});alertEv('ELIMINATED: '+(m.uids.length?m.uids.length:0)+' PLAYER(S)');renderScores()});
  IQ.Net.on('reveal',rv=>{if(G.mp.host)return;
   if(G.lastAppliedRevealRound===G.round)return; // idempotent: never double-apply a reveal
   G.lastAppliedRevealRound=G.round;
   if(rv.imp)banner('THIS ROUND MADE NO SENSE. NOBODY WINS.');
   const btns=$$('#opts-grid .opt-btn');
   const cb=btns.find(b=>+b.dataset.i===rv.answer);
   if(cb)cb.classList.add('correct');
   fireHooks('onReveal',{correctIdx:rv.answer});
   applyScoresFrame(rv.scores)});
  IQ.Net.on('end',m=>{
   if(m&&Array.isArray(m.scores)&&G.screen==='play'){applyScoresFrame(m.scores);alertEv('MATCH TERMINATED');return}
   if(G.screen==='play'){alertEv('CONNECTION LOST');G.mp={on:false,host:false,code:''}}else alertEv('ROOM CLOSED')});
 }catch(e){}
}

function saveForged(){
 if(FORGE.hole==null||FORGE.hole<0){alertEv('SET A HOLE FIRST');return}
 const diff=+($('#fg-diff .on')?.dataset.v||2);
 const cols=FORGE.cols,rows=FORGE.rows,cells=FORGE.grid,hole=FORGE.hole;
 const r0=Math.floor(hole/cols),c0=hole%cols;
 const nb=[[r0,c0-1],[r0-1,c0],[r0,c0+1],[r0+1,c0]].find(([rr,cc])=>rr>=0&&cc>=0&&rr<rows&&cc<cols&&cells[rr*cols+cc]);
 const correctFill=nb?(()=>{const n=cells[nb[0]*cols+nb[1]];return{...n,color:(n.color+1)%8}})():{shape:'ring',color:ri(0,7),rot:0};
 const opts=[{cols:1,rows:1,cells:[correctFill]}];
 for(let i=1;i<8;i++){const m={...correctFill};const w=i%3;
  if(w===0)m.color=(m.color+ri(1,7))%8;
  else if(w===1)m.shape=['plus','cross','ring','square','diamond','triangle'][ri(0,5)];
  else m.rot=((m.rot||0)+ri(1,3))%4;
  if(!opts.some(o=>JSON.stringify(o.cells[0])===JSON.stringify(m)))opts.push({cols:1,rows:1,cells:[m]});else i--}
 const order=opts.map((_,i)=>i);
 for(let i=order.length-1;i>0;i--){const j=ri(0,i);[order[i],order[j]]=[order[j],order[i]]}
 const savedAnswer=order.indexOf(0);
 const puzzle={id:FORGE.editingId||('f'+Date.now()+ri(0,999)),
  name:($('#fg-name')?.value.trim()||'Unnamed Sigil'),prompt:($('#fg-prompt')?.value.trim()||'COMPLETE THE FORBIDDEN SIGIL.'),
  kind:'matrix',difficulty:diff,rule:'forged by '+(P.name||'anon'),
  board:{cols,rows,cells:cells.slice(),holeIndex:hole},options:order.map(i=>opts[i]),answer:savedAnswer};
 const arr=store.get('IQB_PUZZLES_V1',[]);const ix=arr.findIndex(x=>x.id===puzzle.id);
 if(ix>=0)arr[ix]=puzzle;else arr.push(puzzle);
 store.set('IQB_PUZZLES_V1',arr);AU.p('sacrifice');alertEv('IMPRISONED ✓');setTimeout(openForge,600);
}

function openSettings(){
 nav('center');const cc=$('#center-content');
 let muted=store.get('IQB_MUTED',false),motion=store.get('IQB_MOTION',true),voice=S.voiceOn;
 cc.innerHTML='<div style="align-self:stretch;display:flex;align-items:center;gap:14px;width:min(560px,94vw)">'+
  '<button class="btn btn-ghost" data-nav="landing">← Back</button><h2 style="flex:1">SETTINGS</h2></div>'+
  '<div class="panel" style="width:min(560px,94vw)">'+
  '<div class="sw-row"><div class="sw '+(muted?'':'on')+'" id="sw-sound"></div><div>Sound</div></div>'+
  '<div class="sw-row"><div class="sw '+(motion?'on':'')+'" id="sw-motion"></div><div>Screen chaos</div></div>'+
  '<div class="sw-row"><div style="flex:1"></div></div>'+
  '<div class="sw-row"><div style="flex:1"></div><button class="btn btn-danger" id="wipe-btn" style="font-size:12px;padding:10px 18px">Burn All Records</button></div></div>';
 bindNav();
 $('#sw-sound').onclick=e=>{muted=!muted;store.set('IQB_MUTED',muted);e.target.classList.toggle('on',!muted);AU.mute(muted)};
 $('#sw-motion').onclick=e=>{motion=!motion;store.set('IQB_MOTION',motion);e.target.classList.toggle('on',motion);CX.inten(motion?.5:0)};
 $('#wipe-btn').onclick=()=>{if(confirm('Erase every record?')){localStorage.removeItem('IQB_PROFILE_V1');localStorage.removeItem('IQB_PUZZLES_V1');location.reload()}};
}

/* ---------- misc ---------- */
function alertEv(msg){banner(msg)}
function bindNav(){$$('[data-nav]').forEach(b=>b.onclick=()=>goNav(b.dataset.nav))}
function goNav(to){if(to==='forge')openForge();else if(to==='grimoire')openGrimoire();else if(to==='settings')openSettings();else nav('landing')}

/* ---------- boot ---------- */
function boot(){
 document.body.classList.add('act-0');
 SH.ok=!!(window.IQ&&IQ.Shadow);
 CX.mount();AU.init();
 if(store.get('IQB_MUTED',false))AU.mute(true);
 wireLanding();
 try{window.IQ&&IQ.RoomUI&&IQ.RoomUI.mount()}catch(e){}
 try{window.IQ&&IQ.Fun&&IQ.Fun.init({onAnswer:function(c,r){},onRoundStart:function(r){},onEmerald:function(n){},getStage:function(){return G.stage}})}catch(e){}
 try{window.IQ&&IQ.Onboard&&IQ.Onboard.start()}catch(e){}
}
addEventListener('keydown',e=>{
 if(G.screen!=='play'||G.answered)return;
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const n=+e.key;
 if(n>=1&&n<=8){
  let pos=n-1;
  if(performance.now()<G.invertUntil)pos=7-pos; // hook-inverted controls
  $$('#opts-grid .opt-btn')[pos]?.click();
 }
});
addEventListener('pointerdown',()=>{AU.init();try{window.IQ&&IQ.Music&&IQ.Music.userGesture()}catch(e){}},{once:true});
boot();
</script>
