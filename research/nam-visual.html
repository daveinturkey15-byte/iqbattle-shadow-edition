<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pack-nam visual harness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap">
<style>
 body{margin:0;background:#060b08;color:#cfe8c6;font-family:'Oxanium',monospace}
 .stage{max-width:760px;margin:0 auto;padding:20px}
 #board-frame{width:340px;height:238px;border:1px solid rgba(140,190,120,.3);border-radius:10px;
   background:linear-gradient(135deg,#0d2417,#123021);position:relative;overflow:hidden}
 .stage{max-width:760px;margin:0 auto;padding:20px;position:relative;z-index:1}
 #opts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;width:640px}
 .hook-overlay{position:fixed;left:0;right:0;top:16%;display:flex;justify-content:center;pointer-events:none;z-index:90;font-family:'Oxanium',sans-serif}
   min-height:70px;color:#9fb6d8;font-size:11px;display:flex;align-items:center;justify-content:center}
 .opt-disabled{opacity:.28;filter:grayscale(1);pointer-events:none}
</style>
</head>
<body>
<div class="stage">
  <div id="round-label">DEPTH 1 — NAM VISUAL HARNESS (move cursor over board)</div>
  <div id="board-frame"></div>
  <div id="opts-grid" class="opts-grid"></div>
  <pre id="log" style="font-size:10px;color:#7fae74;margin-top:12px"></pre>
</div>
<script src="../hooks.js"></script>
<script src="../worlds.js"></script>
<script src="../pack-nam.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;
 let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
$('#board-frame').innerHTML='<svg width="100%" height="100%" viewBox="0 0 9 9">'+
 Array.from({length:81},(_,i)=>`<rect x="${i%9}" y="${(i/9)|0}" width="1" height="1" fill="${i%2?'#1c4429':'#25603a'}"/>`).join('')+'</svg>';
for(let i=0;i<8;i++){const b=document.createElement('div');b.className='opt-btn';b.dataset.i=String((i*3)%8);
 b.textContent='OPTION '+(i+1);$('#opts-grid').appendChild(b);}
IQ.Worlds.apply('nam-jungle');
IQ.Hooks.beginRun('visual',42);
const TL = +(new URLSearchParams(location.search).get('tl')) || 60;
mods('roundStart',{round:1,world:'nam-jungle',align:'bad',hp:100,score:0,streak:0,timerLen:TL,optCount:8,runId:'visual'});
const log=[];
function banner(t){log.push(t);$('#log').textContent=log.slice(-6).join('\n');}
function mods(evt,extra){return IQ.Hooks.dispatch(evt,Object.assign({rng:mulberry32((Math.random()*1e6)|0)},extra||{}));}
setInterval(()=>{
 const ms=mods('tick',{round:1,runId:'visual'});
 for(const m of ms){
   if(m.bannerText)banner(m.bannerText);
   if(m.overlayHTML){const d=document.createElement('div');d.className='hook-overlay';
     d.innerHTML=String(m.overlayHTML).slice(0,2000);document.body.appendChild(d);
     setTimeout(()=>d.remove(),3200);}
   if(Array.isArray(m.disableOptionIdx)&&m.disableOptionIdx.length)
     document.querySelectorAll('#opts-grid .opt-btn').forEach(b=>{if(m.disableOptionIdx.includes(+b.dataset.i))b.classList.add('opt-disabled')});
   else if(Array.isArray(m.disableOptionIdx))
     document.querySelectorAll('#opts-grid .opt-btn').forEach(b=>b.classList.remove('opt-disabled'));
 }
},250);
</script>
</body>
</html>
