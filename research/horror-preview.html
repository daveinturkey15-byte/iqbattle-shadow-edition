<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>pack-horror preview</title>
<style>
body{margin:0;background:#000;font-family:monospace;color:#eee}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
#world-canvas{position:absolute;inset:0;width:100%;height:100%}
#label{position:fixed;left:8px;top:6px;z-index:50;background:#000a;padding:4px 10px;font-size:13px}
.hook-overlay{position:fixed;left:0;right:0;top:16%;display:flex;justify-content:center;pointer-events:none;z-index:90}
</style>
</head><body>
<div id="stage"><canvas id="world-canvas"></canvas></div>
<div id="label">world: -</div>
<script src="../worlds.js"></script>
<script src="../hooks.js"></script>
<script src="../pack-horror.js"></script>
<script>
// static frame painter: pulls registered defs via Worlds.list + apply-free drawing
// Worlds keeps REG internal; use apply() cycling instead.
const ids = ['sandman-dream','grief-box','well-curse','hive-acid','upside-down'];
let i = 0;
const cv = document.getElementById('world-canvas');
cv.width = innerWidth; cv.height = innerHeight;
function cycle(){
  const id = ids[i % ids.length]; i++;
  document.getElementById('label').textContent = 'world: ' + id;
  window.IQ.Worlds.apply(id);
}
cycle();
setInterval(cycle, 2500);
</script>
</body></html>
